# Vale prose linter: Google developer documentation style guide.
# The Google package is vendored in .vale/styles/Google (pinned, MIT).
# Errors fail the required "ci" check; warnings are shown but do not fail.
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Project

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale, Google
# Raised to error: the four rules that carry the standard's style choices
# (sentence-case headings, second person, present tense).
Google.Headings = error
Google.FirstPerson = error
Google.We = error
Google.Will = error
# Spelling is advisory: technical terms belong in the Project vocabulary.
Vale.Spelling = warning

[CHANGELOG.md]
BasedOnStyles =

# Decision records and contributor notes are written by and for maintainers:
# first person plural and future tense ("we will migrate") are normal there.
[docs/dev/**/*.{md,mdx}]
BasedOnStyles = Vale, Google
Google.Headings = error
Google.We = warning
Google.Will = warning
Google.FirstPerson = warning
Vale.Spelling = warning
