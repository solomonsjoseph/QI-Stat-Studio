version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies]
    groups:
      hooks:
        patterns: ["*"]
# LANGUAGE ECOSYSTEMS (added by overlay)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    commit-message:
      prefix: fix
      include: scope
    labels: [dependencies]
    # requirements files have no dev/prod split, so every bump is fix(deps).
    # One PR per group, so a week of bumps is one patch release, not many.
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    labels: [dependencies]
    # One PR per group, so a week of bumps is one patch release, not many.
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
